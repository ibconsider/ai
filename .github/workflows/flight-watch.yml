name: Flight price watch

on:
  schedule:
    # Every 2 hours (UTC). GitHub schedule often runs late (minutes–hours);
    # phone push (Telegram/ntfy) still fires as soon as the job actually runs.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "GitHub issue + phone push when under threshold"
        type: boolean
        default: true
      test_push:
        description: "Test phone push only (Telegram/ntfy/Discord) — no price check"
        type: boolean
        default: false
  pull_request:
    paths:
      - "flight-watch/**"
      - ".github/workflows/flight-watch.yml"

permissions:
  contents: read
  issues: write

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax + dry-run
        run: |
          node --check flight-watch/check.mjs
          node --check flight-watch/lib/fx.mjs
          node --check flight-watch/lib/travelpayouts.mjs
          node --check flight-watch/lib/links.mjs
          node --check flight-watch/lib/github.mjs
          node --check flight-watch/lib/ntfy.mjs
          node --check flight-watch/lib/telegram.mjs
          node --check flight-watch/lib/discord.mjs
          node --check flight-watch/lib/notify-all.mjs
          node --check flight-watch/test-push.mjs
          node flight-watch/check.mjs --dry-run

  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Travelpayouts token
        if: ${{ inputs.test_push != true }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "::error::Missing repository secret TRAVELPAYOUTS_TOKEN"
            exit 1
          fi

      - name: Test phone push channels
        if: ${{ inputs.test_push == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: node flight-watch/test-push.mjs

      - name: Run flight watch
        if: ${{ inputs.test_push != true }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          SHOULD_NOTIFY: ${{ github.event_name == 'schedule' && 'true' || inputs.notify }}
        run: |
          if [ "$SHOULD_NOTIFY" = "true" ]; then
            node flight-watch/check.mjs --notify
          else
            node flight-watch/check.mjs
          fi

      - name: Upload report
        if: ${{ always() && inputs.test_push != true }}
        uses: actions/upload-artifact@v4
        with:
          name: flight-watch-report
          path: flight-watch/out/latest.json
          if-no-files-found: ignore
