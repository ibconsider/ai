name: Flight price watch

on:
  schedule:
    # Every 2 hours (UTC). In Europe/Helsinki winter (UTC+2) that is
    # 02,04,06,08,10,12,14,16,18,20,22,00 — about 12 checks/day.
    # Cached fares still move; more frequent catches drops sooner.
    # GitHub Actions cron is UTC-only and may run a bit late.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Create/update GitHub issues + phone push when under threshold"
        type: boolean
        default: true
      test_push:
        description: "Send a test ntfy phone notification (no price check required)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "flight-watch/**"
      - ".github/workflows/flight-watch.yml"

permissions:
  contents: read
  issues: write

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax + dry-run
        run: |
          node --check flight-watch/check.mjs
          node --check flight-watch/lib/fx.mjs
          node --check flight-watch/lib/travelpayouts.mjs
          node --check flight-watch/lib/links.mjs
          node --check flight-watch/lib/github.mjs
          node --check flight-watch/lib/ntfy.mjs
          node flight-watch/check.mjs --dry-run

  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Travelpayouts token
        if: ${{ inputs.test_push != true }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "::error::Missing repository secret TRAVELPAYOUTS_TOKEN"
            echo "1. Free signup: https://www.travelpayouts.com/"
            echo "2. Copy API token from profile"
            echo "3. Repo Settings → Secrets and variables → Actions → New secret → TRAVELPAYOUTS_TOKEN"
            exit 1
          fi

      - name: Test ntfy phone push
        if: ${{ inputs.test_push == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: node flight-watch/test-ntfy.mjs

      - name: Run flight watch
        if: ${{ inputs.test_push != true }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          SHOULD_NOTIFY: ${{ github.event_name == 'schedule' && 'true' || inputs.notify }}
        run: |
          if [ "$SHOULD_NOTIFY" = "true" ]; then
            node flight-watch/check.mjs --notify
          else
            node flight-watch/check.mjs
          fi

      - name: Upload report
        if: ${{ always() && inputs.test_push != true }}
        uses: actions/upload-artifact@v4
        with:
          name: flight-watch-report
          path: flight-watch/out/latest.json
          if-no-files-found: ignore
